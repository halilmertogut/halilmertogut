# Post-credits snake + the live "NOW IN PRODUCTION" card.
# Everything is generated into dist/ and force-published to the `output`
# branch, so main never accumulates bot commits.
name: Credits

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: credits
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # Runs before the snake on purpose: that action is a Docker container and
      # would create dist/ as root, which the runner user cannot write into.
      - name: Live stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/fetch_stats.py > dist/stats.json
          cat dist/stats.json
          uv run --with fonttools --with brotli scripts/build_assets.py --stats dist/stats.json --out dist

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: halilmertogut
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
