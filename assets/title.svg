<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 380" width="908" height="380" role="img" aria-labelledby="title-desc">
<title id="title-desc">HALİL MERT ÖĞÜT — FULL STACK DEVELOPER</title>
<style>
@font-face{font-family:"Jost";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"Jost";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;text-rendering:geometricPrecision}
.leader{opacity:0;animation:hold 1.6s linear 0s}
.leader line{stroke:#232323;stroke-width:1}
.leader circle{fill:none;stroke:#3d3d3d;stroke-width:1}
.leader .field{fill:#262626;stroke:none}
.leader .sweep{stroke:#0b0b0b;stroke-width:66;stroke-dasharray:1;animation:sweep 0.8s linear 0s 2}
.count{font-size:64px;font-weight:500;fill:#f3f3f3;opacity:0}
.scene{animation:flicker .8s steps(1,end) 1.75s both}
.title{font-size:46px;font-weight:500;letter-spacing:0.28em;fill:#f3f3f3;animation:title 1.9s cubic-bezier(.16,1,.3,1) 1.8s both}
.rule{stroke:#3a3a3a;stroke-width:1;transform-origin:454px 212px;animation:rule 1.5s cubic-bezier(.16,1,.3,1) 2.2s both}
.subtitle{font-size:13.5px;letter-spacing:0.55em;fill:#9b9b9b;animation:subtitle 1.7s cubic-bezier(.16,1,.3,1) 2.6s both}
.footer{font-size:10.5px;letter-spacing:0.3em;fill:#5a5a5a;animation:fade 1.4s ease-out 3.35s both}
@media (max-width:560px){.title{font-size:60px}.subtitle{font-size:22px}.footer{font-size:17px}}
@keyframes hold{from{opacity:1}to{opacity:1}}
@keyframes sweep{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flicker{0%{opacity:.45}14%{opacity:1}28%{opacity:.6}42%{opacity:1}58%{opacity:.8}72%{opacity:1}100%{opacity:1}}
@keyframes title{from{opacity:0;letter-spacing:0.6em}to{opacity:1;letter-spacing:0.28em}}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes subtitle{from{opacity:0;letter-spacing:0.95em}to{opacity:1;letter-spacing:0.55em}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="glow" cx="50%" cy="46%" r="62%"><stop offset="0" stop-color="#191919"/><stop offset="1" stop-color="#060606"/></radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<clipPath id="frame"><rect width="908" height="380" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="908" height="380" fill="url(#glow)"/>
<rect width="908" height="380" filter="url(#grain)" opacity=".06"/>
</g>
<rect x=".5" y=".5" width="907" height="379" rx="13.5" fill="none" stroke="#1f1f1f"/>
<g class="leader">
<line x1="0" y1="190" x2="908" y2="190"/><line x1="454" y1="0" x2="454" y2="380"/>
<circle cx="454" cy="190" r="92"/><circle cx="454" cy="190" r="66"/>
<circle class="field" cx="454" cy="190" r="66"/>
<circle class="sweep" cx="454" cy="190" r="33" fill="none" pathLength="1" transform="rotate(-90 454 190)"/>
<text class="count" x="454" y="213.04" text-anchor="middle" style="animation:hold 0.8s linear 0.00s">3</text>
<text class="count" x="454" y="213.04" text-anchor="middle" style="animation:hold 0.8s linear 0.80s">2</text>
</g>
<g class="scene">
<text class="title" x="460.44" y="184" text-anchor="middle">HALİL MERT ÖĞÜT</text>
<line class="rule" x1="344" y1="212" x2="564" y2="212"/>
<text class="subtitle" x="457.71" y="242" text-anchor="middle">FULL STACK DEVELOPER</text>
<text class="footer" x="36" y="350">EST. MMXXII</text>
<text class="footer" x="455.57" y="350" text-anchor="middle">2.39 : 1</text>
<text class="footer" x="875.15" y="350" text-anchor="end">@HALILMERTOGUT</text>
</g>
</svg>
